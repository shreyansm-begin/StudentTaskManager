
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | StudyFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="edit-page">

    <section class="panel">

        <a class="back-link" href="/">← Back to Dashboard</a>

        <h1>Edit Task</h1>
        <p class="muted">Update your task details below.</p>

        <form method="POST">

            <label>Task Title</label>
            <input type="text" name="title"
                   value="{{ task.title }}" required>

            <label>Description</label>
            <textarea name="description">{{ task.description or '' }}</textarea>

            <label>Due Date</label>
            <input type="date" name="due_date"
                   value="{{ task.due_date or '' }}">

            <label>Priority</label>
            <select name="priority">
                {% for item in priorities %}
                    <option value="{{ item }}"
                    {% if task.priority == item %}selected{% endif %}>
                        {{ item }}
                    </option>
                {% endfor %}
            </select>

            <label>Category</label>
            <select name="category">
                {% for item in categories %}
                    <option value="{{ item }}"
                    {% if task.category == item %}selected{% endif %}>
                        {{ item }}
                    </option>
                {% endfor %}
            </select>

            <label>Status</label>
            <select name="status">
                {% for item in statuses %}
                    <option value="{{ item }}"
                    {% if task.status == item %}selected{% endif %}>
                        {{ item }}
                    </option>
                {% endfor %}
            </select>

            <button class="primary-btn" type="submit">Save Changes</button>

        </form>

    </section>

</div>

</body>
</html>
